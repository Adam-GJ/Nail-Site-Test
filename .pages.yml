media:
  input: images
  output: /images

content:
  - name: gallery
    label: Gallery
    type: collection
    path: data/gallery
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, image]
      primary: title
    fields:
      - name: title
        label: Image title
        type: string
        required: true

      - name: image
        label: Image
        type: image
        required: true

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date